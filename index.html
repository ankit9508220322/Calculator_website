<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Website</title>
    <link rel="stylesheet" href="./calculator/Calculator.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <form onsubmit="return false;">
                <div class="display">
                    <input type="text" name="display" aria-label="Calculator display" readonly>
                </div>
                <div>
                    <input type="button" value="AC" onclick="display.value = ''" class="operation">
                    <input type="button" value="DEL" onclick="display.value = display.value.slice(0, -1)" class="operation">
                    <input type="button" value="." onclick="appendValue('.')" class="operation">
                    <input type="button" value="/" onclick="appendValue('/')" class="operation">
                </div>
                <div>
                    <input type="button" value="7" onclick="appendValue('7')">
                    <input type="button" value="8" onclick="appendValue('8')">
                    <input type="button" value="9" onclick="appendValue('9')">
                    <input type="button" value="*" onclick="appendValue('*')" class="operater">
                </div>
                <div>
                    <input type="button" value="4" onclick="appendValue('4')">
                    <input type="button" value="5" onclick="appendValue('5')">
                    <input type="button" value="6" onclick="appendValue('6')">
                    <input type="button" value="-" onclick="appendValue('-')" class="operater">
                </div>
                <div>
                    <input type="button" value="1" onclick="appendValue('1')">
                    <input type="button" value="2" onclick="appendValue('2')">
                    <input type="button" value="3" onclick="appendValue('3')">
                    <input type="button" value="+" onclick="appendValue('+')" class="operater">
                </div>
                <div>
                    <input type="button" value="00" onclick="appendValue('00')">
                    <input type="button" value="0" onclick="appendValue('0')">
                    <input class="equal" type="button" value="=" onclick="calculate()">
                </div>
            </form>
        </div>
    </div>
    <script>
        const display = document.querySelector('input[name="display"]');

        function appendValue(value) {
            display.value += value;
        }

        function calculate() {
            try {
                if (!display.value.trim()) return;
                if (!/^[0-9+*/.()\\s-]+$/.test(display.value)) {
                    throw new Error('Invalid expression');
                }
                const result = Function('"use strict"; return (' + display.value + ')')();
                display.value = Number.isFinite(result) ? String(result) : 'Error';
            } catch {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
